<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodaj utakmicu | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Dodaj utakmicu</span>
    <div class="d-flex align-items-center gap-2"><span class="badge bg-primary" id="userRole"></span><span class="fw-semibold small" id="userName"></span></div>
  </div>
  <div class="page-body">
    <div class="page-header d-flex align-items-center gap-2">
      <a href="list.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h4 class="mb-0">Dodaj utakmicu</h4>
    </div>
    <div class="card form-card">
      <div class="card-body p-4">
        <div id="alert" class="alert alert-danger d-none"></div>
        <form id="form">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Protivnik *</label>
              <input type="text" class="form-control" name="opponent" required placeholder="npr. NK Dinamo Zagreb">
            </div>
            <div class="col-md-6">
              <label class="form-label">Lokacija</label>
              <input type="text" class="form-control" name="location" placeholder="npr. Gradski stadion">
            </div>
            <div class="col-md-6">
              <label class="form-label">Datum i vrijeme *</label>
              <input type="datetime-local" class="form-control" name="match_date" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Vrsta utakmice</label>
              <select class="form-select" name="match_type">
                <option value="league">Liga</option><option value="cup">Kup</option><option value="friendly">Prijateljska</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Domaćin / Gost</label>
              <select class="form-select" name="home_away">
                <option value="home">Domaćin</option><option value="away">Gost</option><option value="neutral">Neutralno</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Selekcija</label>
              <select class="form-select" name="selection_id" id="selectionSelect">
                <option value="">- Bez selekcije -</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Napomena</label>
              <textarea class="form-control" name="notes" rows="2"></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary me-2">
                <span class="spinner-border spinner-border-sm d-none me-1" id="spinner"></span>Dodaj utakmicu
              </button>
              <a href="list.html" class="btn btn-outline-secondary">Odustani</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
  const user = requireRole('super_admin', 'admin', 'coach');
  setUserInfo(user); buildSidebar();

  const isCoach = user.role === 'coach';
  const selWrap = document.getElementById('selectionSelect').closest('.col-md-6');
  const mySel = getSelection(); // { id, name } stored at login, or null

  if (isCoach) {
    if (mySel) {
      selWrap.innerHTML = `
        <label class="form-label">Selekcija</label>
        <input type="text" class="form-control" value="${mySel.name}" disabled>
        <input type="hidden" name="selection_id" value="${mySel.id}">`;
    } else {
      selWrap.innerHTML = `
        <label class="form-label">Selekcija</label>
        <div class="alert alert-warning py-2 small mb-0">Niste dodijeljeni nijednoj selekciji.</div>`;
    }
  } else {
    // Admins load all selections
    apiGet('/selections').then(sels => {
      const sel = document.getElementById('selectionSelect');
      sels.forEach(s => sel.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}</option>`));
    }).catch(() => {});
  }

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const spinner = document.getElementById('spinner');
    const alertEl = document.getElementById('alert');
    btn.disabled = true; spinner.classList.remove('d-none'); alertEl.classList.add('d-none');
    const fd = new FormData(e.target);
    const body = Object.fromEntries(fd.entries());
    Object.keys(body).forEach(k => { if (!body[k]) delete body[k]; });
    if (body.selection_id) body.selection_id = parseInt(body.selection_id);
    try {
      await apiPost('/matches', body);
      showToast('Utakmica dodana');
      setTimeout(() => window.location.href = 'list.html', 1000);
    } catch(err) {
      alertEl.textContent = err.message; alertEl.classList.remove('d-none');
      btn.disabled = false; spinner.classList.add('d-none');
    }
  });
</script>
</body>
</html>
