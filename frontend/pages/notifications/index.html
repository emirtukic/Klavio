<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obavijesti | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <style>
    .notif-item {
      border-left: 4px solid transparent;
      transition: background 0.15s;
      padding: 0.9rem 1.1rem;
      position: relative;
    }
    .notif-item.unread { background: #f0f7ff; }
    .notif-item.unread .notif-title { font-weight: 700; }
    .notif-item.type-info    { border-left-color: #3b82f6; }
    .notif-item.type-warning { border-left-color: #f59e0b; }
    .notif-item.type-success { border-left-color: #22c55e; }
    .notif-item.type-danger  { border-left-color: #ef4444; }
    .notif-icon { width: 38px; height: 38px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .notif-icon.type-info    { background: #dbeafe; color: #3b82f6; }
    .notif-icon.type-warning { background: #fef3c7; color: #d97706; }
    .notif-icon.type-success { background: #dcfce7; color: #16a34a; }
    .notif-icon.type-danger  { background: #fee2e2; color: #dc2626; }
    .notif-title { font-size: 0.92rem; color: #1e293b; margin-bottom: 2px; }
    .notif-msg   { font-size: 0.85rem; color: #475569; line-height: 1.45; }
    .notif-time  { font-size: 0.75rem; color: #94a3b8; margin-top: 3px; }
    .notif-actions { display: flex; gap: 4px; align-items: center; }
.unread-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #3b82f6;
      position: absolute; top: 50%; right: 1rem; transform: translateY(-50%);
    }
  </style>
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Obavijesti</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">

    <!-- Page header -->
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h4><i class="bi bi-bell me-2 text-primary"></i>Obavijesti</h4>
        <p class="text-muted mb-0" id="notifSummary">Učitavanje...</p>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-secondary btn-sm" onclick="markAllRead()">
          <i class="bi bi-check2-all me-1"></i>Označi sve kao pročitano
        </button>
        <button class="btn btn-primary btn-sm d-none" id="sendNotifBtn"
          data-bs-toggle="modal" data-bs-target="#sendModal">
          <i class="bi bi-send me-1"></i>Pošalji obavijest
        </button>
      </div>
    </div>

    <!-- Notifications list -->
    <div class="card table-card">
      <div class="card-body p-0" id="notifList">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border spinner-border-sm me-2"></div>Učitavanje obavijesti...
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Send Notification Modal (admin only) -->
<div class="modal fade" id="sendModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-send me-2"></i>Pošalji obavijest</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">Naslov <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="sendTitle" placeholder="Naslov obavijesti...">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Poruka <span class="text-danger">*</span></label>
          <textarea class="form-control" id="sendMessage" rows="4" placeholder="Tekst obavijesti..."></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Tip</label>
          <select class="form-select" id="sendType">
            <option value="info">Info (plava)</option>
            <option value="success">Uspjeh (zelena)</option>
            <option value="warning">Upozorenje (žuta)</option>
            <option value="danger">Hitno (crvena)</option>
          </select>
        </div>
        <div class="mb-1">
          <label class="form-label fw-semibold">Primatelji</label>
          <div class="d-flex gap-3 mt-1">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="roleAdmin" value="admin" checked>
              <label class="form-check-label" for="roleAdmin">Admini</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="roleCoach" value="coach" checked>
              <label class="form-check-label" for="roleCoach">Treneri</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="roleMember" value="member" checked>
              <label class="form-check-label" for="roleMember">Članovi</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Odustani</button>
        <button type="button" class="btn btn-primary" id="sendSaveBtn" onclick="sendNotification()">
          <span id="sendSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
          <i class="bi bi-send me-1"></i>Pošalji
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
  const user = requireRole('admin', 'super_admin', 'coach', 'member');
  setUserInfo(user); buildSidebar();

  const isAdmin =['admin', 'super_admin'].includes(user.role);
  if (isAdmin) document.getElementById('sendNotifBtn').classList.remove('d-none');

  let notifications = [];

  // ── Load ──
  async function load() {
    try {
      notifications = await apiGet('/notifications');
      render();
    } catch(e) {
      document.getElementById('notifList').innerHTML = `
        <div class="p-4 text-center text-danger"><i class="bi bi-exclamation-triangle me-2"></i>${e.message}</div>`;
      document.getElementById('notifSummary').textContent = '';
    }
  }

  // ── Render ──
  function render() {
    const unread = notifications.filter(n => !n.is_read).length;
    const total  = notifications.length;
    document.getElementById('notifSummary').textContent =
      total === 0 ? 'Nema obavijesti' : `${total} obavijest(i) · ${unread} nepročitano`;

    if (!total) {
      document.getElementById('notifList').innerHTML = `
        <div class="empty-state">
          <i class="bi bi-bell-slash empty-state-icon"></i>
          <p class="fw-semibold">Nema obavijesti</p>
          <p class="small">Ovdje će se prikazivati vaše obavijesti.</p>
        </div>`;
      return;
    }

    const typeIcons = { info: 'info-circle', warning: 'exclamation-triangle',
      success: 'check-circle', danger: 'exclamation-octagon' };

    document.getElementById('notifList').innerHTML = `
      <ul class="list-group list-group-flush">
        ${notifications.map(n => `
          <li class="list-group-item notif-item type-${n.type || 'info'} ${!n.is_read ? 'unread' : ''}">
            <div class="d-flex align-items-start gap-3">
              <div class="notif-icon type-${n.type || 'info'}">
                <i class="bi bi-${typeIcons[n.type] || 'info-circle'}"></i>
              </div>
              <div class="flex-grow-1 min-w-0">
                <div class="notif-title">${escHtml(n.title || '')}</div>
                <div class="notif-msg">${escHtml(n.message || '')}</div>
                <div class="notif-time"><i class="bi bi-clock me-1"></i>${relativeTime(n.created_at)}</div>
              </div>
              <div class="notif-actions">
                ${!n.is_read ? `
                <button class="btn btn-sm btn-outline-primary" onclick="markRead(${n.id})" title="Označi kao pročitano">
                  <i class="bi bi-check2"></i>
                </button>` : `
                <span class="text-success" title="Pročitano"><i class="bi bi-check2-all"></i></span>`}
                <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteNotif(${n.id})" title="Obriši">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
            ${!n.is_read ? '<span class="unread-dot"></span>' : ''}
          </li>`).join('')}
      </ul>`;
  }

  // ── Mark one as read ──
  async function markRead(id) {
    try {
      await apiPut('/notifications/' + id + '/read', {});
      const n = notifications.find(x => x.id === id);
      if (n) n.is_read = true;
      render();
    } catch(e) { showToast(e.message, 'error'); }
  }

  // ── Mark all as read ──
  async function markAllRead() {
    try {
      await apiPut('/notifications/mark-all-read', {});
      notifications.forEach(n => n.is_read = true);
      render();
      showToast('Sve obavijesti označene kao pročitane', 'success');
    } catch(e) { showToast(e.message, 'error'); }
  }

  // ── Delete ──
  async function deleteNotif(id) {
    confirmDelete(async () => {
      try {
        await apiDelete('/notifications/' + id);
        notifications = notifications.filter(n => n.id !== id);
        render();
        showToast('Obavijest obrisana', 'success');
      } catch(e) { showToast(e.message, 'error'); }
    });
  }

  // ── Send notification ──
  async function sendNotification() {
    const title   = document.getElementById('sendTitle').value.trim();
    const message = document.getElementById('sendMessage').value.trim();
    if (!title)   { showToast('Unesite naslov', 'error'); return; }
    if (!message) { showToast('Unesite poruku', 'error'); return; }

    const roles = ['roleAdmin','roleCoach','roleMember']
      .filter(id => document.getElementById(id).checked)
      .map(id => document.getElementById(id).value);

    const spinner = document.getElementById('sendSpinner');
    const btn     = document.getElementById('sendSaveBtn');
    spinner.classList.remove('d-none'); btn.disabled = true;

    try {
      await apiPost('/notifications/notify-club', {
        title, message,
        type:  document.getElementById('sendType').value,
        roles: roles.length < 3 ? roles : undefined
      });
      bootstrap.Modal.getInstance(document.getElementById('sendModal')).hide();
      document.getElementById('sendTitle').value = '';
      document.getElementById('sendMessage').value = '';
      showToast('Obavijest uspješno poslana', 'success');
      load();
    } catch(e) { showToast(e.message, 'error'); }
    finally { spinner.classList.add('d-none'); btn.disabled = false; }
  }

  // ── Relative time ──
  function relativeTime(dateStr) {
    if (!dateStr) return '-';
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins  = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days  = Math.floor(diff / 86400000);
    if (mins < 1)   return 'Upravo sada';
    if (mins < 60)  return `Prije ${mins} min`;
    if (hours < 24) return `Prije ${hours} sat${hours === 1 ? '' : hours < 5 ? 'a' : 'i'}`;
    if (days < 30)  return `Prije ${days} dan${days === 1 ? '' : days < 5 ? 'a' : 'a'}`;
    return formatDate(dateStr);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  load();
</script>
</body>
</html>
