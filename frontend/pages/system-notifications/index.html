<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistemske obavijesti | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Sistemske obavijesti</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-danger" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">
    <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div><h4>Sistemske obavijesti</h4><p class="text-muted mb-0">Obavijesti o održavanju, novim funkcijama i promjenama cijena koje vide svi korisnici.</p></div>
      <button class="btn btn-primary" onclick="openCreate()"><i class="bi bi-plus me-1"></i>Nova obavijest</button>
    </div>

    <div class="card table-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0 table-mobile-cards">
          <thead><tr><th>Tip</th><th>Naslov</th><th>Poruka</th><th>Status</th><th>Datum</th><th></th></tr></thead>
          <tbody id="notifTable">
            <tr class="sk-row"><td><div class="skeleton" style="height:20px;width:90px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:60%;"></div></td><td><div class="skeleton" style="height:13px;width:80%;"></div></td><td><div class="skeleton" style="height:20px;width:65px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:28px;width:60px;border-radius:6px;"></div></td></tr>
            <tr class="sk-row"><td><div class="skeleton" style="height:20px;width:90px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:50%;"></div></td><td><div class="skeleton" style="height:13px;width:70%;"></div></td><td><div class="skeleton" style="height:20px;width:65px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:28px;width:60px;border-radius:6px;"></div></td></tr>
            <tr class="sk-row"><td><div class="skeleton" style="height:20px;width:90px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:70%;"></div></td><td><div class="skeleton" style="height:13px;width:65%;"></div></td><td><div class="skeleton" style="height:20px;width:65px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:28px;width:60px;border-radius:6px;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Create Modal -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nova sistemska obavijest</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-sm-4">
            <label class="form-label">Tip</label>
            <select class="form-select" id="nType">
              <option value="general">Opća</option>
              <option value="feature">Nova funkcija</option>
              <option value="maintenance">Održavanje</option>
              <option value="pricing">Promjena cijene</option>
            </select>
          </div>
          <div class="col-sm-8">
            <label class="form-label">Naslov</label>
            <input type="text" class="form-control" id="nTitle" placeholder="npr. Planirano održavanje - subota 02:00">
          </div>
          <div class="col-12">
            <label class="form-label">Poruka</label>
            <textarea class="form-control" id="nBody" rows="4" placeholder="Detaljan opis obavijesti..."></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Odustani</button>
        <button type="button" class="btn btn-primary" onclick="createNotif()">Objavi</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
const user = requireRole('super_admin');
setUserInfo(user);
buildSidebar();

const TYPE_ICON  = { maintenance:'🔧', feature:'✨', pricing:'💰', general:'📢' };
const TYPE_COLOR = { maintenance:'warning', feature:'success', pricing:'danger', general:'primary' };
const TYPE_LABEL = { maintenance:'Održavanje', feature:'Nova funkcija', pricing:'Promjena cijene', general:'Opća' };

async function load() {
  try {
    const rows = await apiGet('/system-notifications');
    document.getElementById('notifTable').innerHTML = rows.map(n=>`
      <tr class="${n.is_active?'':'table-secondary opacity-75'}">
        <td data-label="Tip"><span class="badge bg-${TYPE_COLOR[n.type]||'secondary'}">${TYPE_ICON[n.type]||''} ${TYPE_LABEL[n.type]||n.type}</span></td>
        <td data-label="Naslov" class="fw-semibold">${n.title}</td>
        <td data-label="Poruka" class="text-muted small" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.body}</td>
        <td data-label="Status">${n.is_active
          ? '<span class="badge bg-success">Aktivna</span>'
          : '<span class="badge bg-secondary">Neaktivna</span>'}</td>
        <td data-label="Datum" class="small text-muted">${new Date(n.created_at).toLocaleDateString('bs-BA')}</td>
        <td>
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-secondary" onclick="toggle(${n.id})" title="${n.is_active?'Deaktiviraj':'Aktiviraj'}">
              <i class="bi bi-toggle-${n.is_active?'on text-success':'off'}"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="remove(${n.id})"><i class="bi bi-trash"></i></button>
          </div>
        </td>
      </tr>`).join('') || '<tr><td colspan="6" class="text-center text-muted py-3">Nema obavijesti</td></tr>';
  } catch(e) { showToast(e.message, 'error'); }
}

function openCreate() {
  document.getElementById('nTitle').value='';
  document.getElementById('nBody').value='';
  new bootstrap.Modal(document.getElementById('createModal')).show();
}

async function createNotif() {
  const title = document.getElementById('nTitle').value.trim();
  const body  = document.getElementById('nBody').value.trim();
  const type  = document.getElementById('nType').value;
  if (!title || !body) return showToast('Unesite naslov i poruku','error');
  try {
    await apiPost('/system-notifications', { type, title, body });
    bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
    showToast('Obavijest objavljena','success'); load();
  } catch(e) { showToast(e.message,'error'); }
}

async function toggle(id) {
  try { await api('/system-notifications/'+id+'/toggle',{method:'PATCH'}); load(); }
  catch(e) { showToast(e.message,'error'); }
}

function remove(id) {
  confirmDelete(async () => {
    try { await apiDelete('/system-notifications/'+id); showToast('Obrisano','success'); load(); }
    catch(e) { showToast(e.message,'error'); }
  }, 'Obrisati obavijest?');
}

load();
</script>
</body>
</html>
