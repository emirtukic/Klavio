<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poruke | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Poruke od Klavio</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">
    <div class="page-header">
      <h4>Poruke</h4>
      <p class="text-muted mb-0">Poruke i obavijesti od Klavio administratora.</p>
    </div>

    <div class="card table-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr><th>Tip</th><th>Naslov</th><th>Odgovori</th><th>Posljednja aktivnost</th><th></th></tr>
          </thead>
          <tbody id="msgTable">
            <tr class="sk-row"><td><div class="skeleton" style="height:20px;width:55px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:75%;"></div></td><td><div class="skeleton" style="height:13px;width:30px;"></div></td><td><div class="skeleton" style="height:13px;width:60%;"></div></td><td><div class="skeleton" style="height:28px;width:70px;border-radius:6px;"></div></td></tr>
            <tr class="sk-row"><td><div class="skeleton" style="height:20px;width:60px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:65%;"></div></td><td><div class="skeleton" style="height:13px;width:25px;"></div></td><td><div class="skeleton" style="height:13px;width:55%;"></div></td><td><div class="skeleton" style="height:28px;width:70px;border-radius:6px;"></div></td></tr>
            <tr class="sk-row"><td><div class="skeleton" style="height:20px;width:50px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:80%;"></div></td><td><div class="skeleton" style="height:13px;width:30px;"></div></td><td><div class="skeleton" style="height:13px;width:65%;"></div></td><td><div class="skeleton" style="height:28px;width:70px;border-radius:6px;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Thread Modal -->
<div class="modal fade" id="threadModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="threadSubject"></h5>
          <div class="d-flex gap-2 mt-1" id="threadMeta"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="max-height:460px;overflow-y:auto;" id="threadMessages"></div>
      <div class="modal-footer flex-column align-items-stretch">
        <textarea class="form-control mb-2" id="replyBody" rows="3" placeholder="Unesite odgovor..."></textarea>
        <div class="d-flex justify-content-end">
          <button class="btn btn-primary" onclick="sendReply()"><i class="bi bi-send me-1"></i>Odgovori</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
const user = requireRole('admin', 'super_admin');
setUserInfo(user); buildSidebar();

let allMsgs = [], currentMsgId = null;

async function load() {
  allMsgs = await apiGet('/platform-messaging/mine');
  renderTable();
}

function renderTable() {
  document.getElementById('msgTable').innerHTML = allMsgs.map(m => {
    const hasNewReply = m.last_reply_role === 'super_admin';
    const lastActivity = m.last_reply_at || m.created_at;
    return `
    <tr style="cursor:pointer;" onclick="openThread(${m.id})">
      <td>
        ${m.type === 'broadcast'
          ? '<span class="badge bg-primary">Broadcast</span>'
          : '<span class="badge bg-info text-dark">Direktna</span>'}
      </td>
      <td>
        ${hasNewReply ? '<i class="bi bi-circle-fill text-primary me-1" style="font-size:0.45rem;vertical-align:middle;"></i>' : ''}
        <span class="${hasNewReply ? 'fw-semibold' : ''}">${m.subject}</span>
      </td>
      <td class="text-center text-muted small">${m.reply_count || 0}</td>
      <td class="small text-muted">${new Date(lastActivity).toLocaleString('bs-BA')}</td>
      <td><i class="bi bi-chevron-right text-muted"></i></td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="text-center text-muted py-3">Nema poruka</td></tr>';
}

async function openThread(id) {
  currentMsgId = id;
  const { message: msg, replies } = await apiGet('/platform-messaging/' + id + '/replies');
  document.getElementById('threadSubject').textContent = msg.subject;
  document.getElementById('threadMeta').innerHTML =
    `${msg.type === 'broadcast' ? '<span class="badge bg-primary">Broadcast</span>' : '<span class="badge bg-info text-dark">Direktna</span>'}
     <span class="text-muted small">${new Date(msg.created_at).toLocaleDateString('bs-BA')}</span>`;
  document.getElementById('replyBody').value = '';

  // Build the full conversation (original message + replies)
  const allBubbles = [
    { body: msg.body, user_name: msg.sent_by_name, user_role: 'super_admin', created_at: msg.created_at },
    ...replies
  ];

  document.getElementById('threadMessages').innerHTML = allBubbles.map(r => {
    const isStaff = r.user_role === 'super_admin';
    return `
    <div class="d-flex gap-2 mb-3 ${isStaff ? '' : 'flex-row-reverse'}">
      <div class="flex-shrink-0">
        <div class="rounded-circle d-flex align-items-center justify-content-center" style="width:36px;height:36px;background:${isStaff ? '#9b86f2' : '#e2e8f0'}">
          <i class="bi bi-${isStaff ? 'shield-check text-white' : 'person text-muted'}"></i>
        </div>
      </div>
      <div class="flex-grow-1">
        <div class="small fw-semibold ${isStaff ? '' : 'text-end'} mb-1">
          ${r.user_name}
          ${isStaff ? '<span class="badge ms-1" style="background:#9b86f2">Klavio</span>' : ''}
        </div>
        <div class="p-3 rounded-3 ${isStaff ? 'text-white' : 'bg-light'}" style="${isStaff ? 'background:#9b86f2' : ''};white-space:pre-wrap;">${r.body}</div>
        <div class="small text-muted mt-1 ${isStaff ? '' : 'text-end'}">${new Date(r.created_at).toLocaleString('bs-BA')}</div>
      </div>
    </div>`;
  }).join('');

  const container = document.getElementById('threadMessages');
  container.scrollTop = container.scrollHeight;

  const _tm = document.getElementById('threadModal');
  (bootstrap.Modal.getInstance(_tm) || new bootstrap.Modal(_tm)).show();

  // Mark as "read" by refreshing the list after a short delay
  setTimeout(() => { load(); }, 500);
}

async function sendReply() {
  const body = document.getElementById('replyBody').value.trim();
  if (!body) return;
  try {
    await apiPost('/platform-messaging/' + currentMsgId + '/replies', { body });
    showToast('Odgovor poslan', 'success');
    openThread(currentMsgId); load();
  } catch(e) { showToast(e.message, 'error'); }
}

load();
</script>
</body>
</html>
