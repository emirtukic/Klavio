<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raspored trenera | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Raspored trenera</span>
    <div class="d-flex align-items-center gap-2"><span class="badge bg-primary" id="userRole"></span><span class="fw-semibold small" id="userName"></span></div>
  </div>
  <div class="page-body">
    <div class="page-header d-flex align-items-center gap-2">
      <a href="list.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h4 class="mb-0" id="pageTitle">Raspored trenera</h4>
    </div>
    <div class="card table-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Naziv</th><th>Datum</th><th>Vrijeme</th><th>Lokacija</th><th>Status</th></tr></thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="p-2"><span class="skeleton sk-row"></span></td></tr>
            <tr><td colspan="5" class="p-2"><span class="skeleton sk-row"></span></td></tr>
            <tr><td colspan="5" class="p-2"><span class="skeleton sk-row" style="width:80%"></span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
  const user = requireAuth();
  setUserInfo(user);
  buildSidebar();
  const id = new URLSearchParams(location.search).get('id');
  async function load() {
    try {
      let sessions;
      if (id) {
        const coach = await apiGet('/coaches/' + id);
        document.getElementById('pageTitle').textContent = coach.name + ' - Raspored';
        sessions = coach.sessions || [];
      } else {
        sessions = await apiGet('/coaches/my-schedule');
      }
      document.getElementById('tableBody').innerHTML = sessions.map(s => `
        <tr><td>${s.title}</td><td>${formatDate(s.session_date)}</td>
        <td class="small">${s.start_time} - ${s.end_time}</td>
        <td>${s.location || '-'}</td><td>${statusBadge(s.status)}</td></tr>
      `).join('') || '<tr><td colspan="5" class="text-center text-muted py-4">Nema treninga</td></tr>';
    } catch(e) { showToast(e.message, 'error'); }
  }
  load();
</script>
</body>
</html>
