<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodaj člana | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Dodaj člana</span>
    <div class="d-flex align-items-center gap-2"><span class="badge bg-primary" id="userRole"></span><span class="fw-semibold small" id="userName"></span></div>
  </div>
  <div class="page-body">
    <div class="page-header d-flex align-items-center gap-2">
      <a href="list.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h4 class="mb-0">Dodaj novog člana</h4>
    </div>
    <div class="card form-card">
      <div class="card-body p-4">
        <div id="alert" class="alert alert-danger d-none"></div>
        <form id="form">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Puno ime i prezime *</label>
              <input type="text" class="form-control" name="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">E-mail *</label>
              <input type="email" class="form-control" name="email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Broj članske karte</label>
              <input type="text" class="form-control" name="membership_number" placeholder="npr. MBR-004">
            </div>
            <div class="col-md-6">
              <label class="form-label">Telefon</label>
              <input type="text" class="form-control" name="phone">
            </div>
            <div class="col-md-6">
              <label class="form-label">Datum rođenja</label>
              <input type="date" class="form-control" name="date_of_birth">
            </div>
            <div class="col-md-6">
              <label class="form-label">Datum učlanjenja</label>
              <input type="date" class="form-control" name="join_date">
            </div>
            <div class="col-md-6">
              <label class="form-label">Pozicija</label>
              <select class="form-select" name="position">
                <option value="">- Odaberi poziciju -</option>
                <option>Golman</option><option>Odbrana</option><option>Vezni red</option><option>Napad</option>
                <option>Lijevo krilo</option><option>Desno krilo</option><option>Zentarhalf</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Broj dresa</label>
              <input type="number" class="form-control" name="jersey_number" min="1" max="99" placeholder="npr. 10">
            </div>
            <div class="col-md-6">
              <label class="form-label">Selekcija</label>
              <select class="form-select" name="selection_id" id="selectionSelect">
                <option value="">- Bez selekcije -</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Adresa</label>
              <textarea class="form-control" name="address" rows="2"></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary me-2">
                <span class="spinner-border spinner-border-sm d-none me-1" id="spinner"></span>
                Dodaj člana
              </button>
              <a href="list.html" class="btn btn-outline-secondary">Odustani</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
  const user = requireRole('super_admin', 'admin');
  setUserInfo(user); buildSidebar();

  apiGet('/selections').then(sels => {
    const sel = document.getElementById('selectionSelect');
    sels.forEach(s => sel.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}</option>`));
  }).catch(() => {});

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const spinner = document.getElementById('spinner');
    const alertEl = document.getElementById('alert');
    btn.disabled = true; spinner.classList.remove('d-none'); alertEl.classList.add('d-none');
    const fd = new FormData(e.target);
    const body = Object.fromEntries(fd.entries());
    Object.keys(body).forEach(k => { if (!body[k]) delete body[k]; });
    if (body.selection_id) body.selection_id = parseInt(body.selection_id);
    try {
      await apiPost('/members', body);
      showToast('Član uspješno dodan');
      setTimeout(() => window.location.href = 'list.html', 1000);
    } catch(err) {
      alertEl.textContent = err.message; alertEl.classList.remove('d-none');
      btn.disabled = false; spinner.classList.add('d-none');
    }
  });
</script>
</body>
</html>
