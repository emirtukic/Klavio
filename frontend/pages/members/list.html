<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Članovi | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <style>
    .bulk-bar { background: var(--club-accent,#3b82f6); color:#fff; border-radius:10px; padding:.6rem 1rem; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }
    .bulk-bar .count-pill { background:rgba(255,255,255,.25); border-radius:999px; padding:.15em .65em; font-weight:700; font-size:.85rem; }
    #tableBody tr.row-selected { background: rgba(59,130,246,.07); }
    .cb-col { width: 36px; }
  </style>
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Članovi</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div><h4>Članovi</h4><p class="text-muted mb-0">Upravljanje članovima kluba</p></div>
      <a href="add.html" class="btn btn-primary" id="addBtn"><i class="bi bi-plus-lg me-1"></i>Dodaj člana</a>
    </div>

    <!-- Bulk action bar (hidden until selection) -->
    <div id="bulkBar" class="bulk-bar mb-3 d-none">
      <span class="count-pill" id="bulkCount">0</span>
      <span>odabranih</span>
      <div class="d-flex gap-2 flex-wrap ms-auto">
        <div class="dropdown">
          <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-arrow-repeat me-1"></i>Promijeni status
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" onclick="bulkStatus('active')"><i class="bi bi-check-circle text-success me-2"></i>Aktivan</a></li>
            <li><a class="dropdown-item" href="#" onclick="bulkStatus('inactive')"><i class="bi bi-pause-circle text-secondary me-2"></i>Neaktivan</a></li>
            <li><a class="dropdown-item" href="#" onclick="bulkStatus('suspended')"><i class="bi bi-x-circle text-danger me-2"></i>Suspendovan</a></li>
          </ul>
        </div>
        <div class="dropdown" id="bulkSelDropdown">
          <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-layers me-1"></i>Dodijeli selekciju
          </button>
          <ul class="dropdown-menu" id="bulkSelMenu">
            <li><a class="dropdown-item text-muted" href="#" onclick="bulkSelection(null)"><i class="bi bi-dash me-2"></i>Ukloni iz selekcije</a></li>
            <li><hr class="dropdown-divider"></li>
          </ul>
        </div>
        <button class="btn btn-sm btn-danger" onclick="bulkDelete()">
          <i class="bi bi-trash me-1"></i>Obriši odabrane
        </button>
        <button class="btn btn-sm btn-outline-light" onclick="clearSelection()">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <div class="card table-card">
      <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex gap-2 flex-wrap align-items-center">
          <input type="text" class="form-control form-control-sm" id="search" style="width:220px"
            autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"
            placeholder="Pretraži ime, email, broj..." oninput="renderTable()">
          <select class="form-select form-select-sm" id="fStatus" style="width:140px" onchange="renderTable()">
            <option value="">Svi statusi</option>
            <option value="active">Aktivan</option>
            <option value="inactive">Neaktivan</option>
            <option value="suspended">Suspendovan</option>
          </select>
          <select class="form-select form-select-sm" id="fSelection" style="width:160px" onchange="renderTable()">
            <option value="">Sve selekcije</option>
          </select>
          <input type="date" class="form-control form-control-sm" id="fJoinFrom" style="width:145px" title="Učlanjen od" onchange="renderTable()">
          <input type="date" class="form-control form-control-sm" id="fJoinTo" style="width:145px" title="Učlanjen do" onchange="renderTable()">
          <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()" title="Resetuj"><i class="bi bi-x-lg"></i></button>
        </div>
        <span class="text-muted small" id="memberCount"></span>
      </div>
      <div class="table-responsive">
        <table class="table table-hover mb-0 table-mobile-cards">
          <thead>
            <tr>
              <th class="cb-col" id="canEditTh" style="display:none;">
                <input type="checkbox" class="form-check-input" id="selectAll" onchange="toggleSelectAll(this.checked)">
              </th>
              <th>Ime</th>
              <th>Broj članske</th>
              <th>E-mail</th>
              <th>Telefon</th>
              <th>Selekcija</th>
              <th>Učlanjen</th>
              <th>Status</th>
              <th>Akcije</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="sk-row"><td colspan="9"><div class="skeleton" style="height:13px;"></div></td></tr>
            <tr class="sk-row"><td colspan="9"><div class="skeleton" style="height:13px;"></div></td></tr>
            <tr class="sk-row"><td colspan="9"><div class="skeleton" style="height:13px;"></div></td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2 py-2">
        <span class="text-muted small" id="pageInfo"></span>
        <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
  const user = requireRole('super_admin', 'admin', 'coach');
  setUserInfo(user); buildSidebar();
  const canEdit = ['super_admin','admin'].includes(user.role);
  const isAdmin = canEdit;

  if (!canEdit) document.getElementById('addBtn').classList.add('d-none');
  if (canEdit)  document.getElementById('canEditTh').style.display = '';

  let allMembers = [];
  let allSelections = [];
  let selectedIds  = new Set();
  let currentPage  = 1;
  const PAGE_SIZE  = 20;

  async function load() {
    try {
      [allMembers, allSelections] = await Promise.all([
        apiGet('/members'),
        apiGet('/selections').catch(() => [])
      ]);
      // Populate selection filter
      const selSel = document.getElementById('fSelection');
      allSelections.forEach(s => selSel.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}</option>`));
      // Populate bulk selection menu
      const menu = document.getElementById('bulkSelMenu');
      allSelections.forEach(s => {
        const li = document.createElement('li');
        li.innerHTML = `<a class="dropdown-item" href="#" onclick="bulkSelection(${s.id})">${s.name}</a>`;
        menu.appendChild(li);
      });
      currentPage = 1;
      renderTable();
    } catch(e) { showToast(e.message, 'error'); }
  }

  function filtered() {
    const q  = (document.getElementById('search').value || '').toLowerCase();
    const st = document.getElementById('fStatus').value;
    const sl = document.getElementById('fSelection').value;
    const fr = document.getElementById('fJoinFrom').value;
    const to = document.getElementById('fJoinTo').value;
    return allMembers.filter(m => {
      const jd = (m.join_date || '').slice(0,10);
      return (
        (!q  || (m.name||'').toLowerCase().includes(q) || (m.email||'').toLowerCase().includes(q) || (m.membership_number||'').toLowerCase().includes(q)) &&
        (!st || m.status === st) &&
        (!sl || String(m.selection_id) === sl) &&
        (!fr || jd >= fr) &&
        (!to || jd <= to)
      );
    });
  }

  function renderTable() {
    const members = filtered();
    const total   = members.length;
    const pages   = Math.ceil(total / PAGE_SIZE) || 1;
    if (currentPage > pages) currentPage = 1;
    const start   = (currentPage - 1) * PAGE_SIZE;
    const page    = members.slice(start, start + PAGE_SIZE);

    document.getElementById('memberCount').textContent = total + ' članova';
    document.getElementById('pageInfo').textContent    = `Prikazano ${start+1}–${Math.min(start+PAGE_SIZE,total)} od ${total}`;

    const colCount = canEdit ? 9 : 8;
    document.getElementById('tableBody').innerHTML = page.length ? page.map(m => {
      const selName = allSelections.find(s => s.id === m.selection_id)?.name || '—';
      const checked = selectedIds.has(m.id) ? 'checked' : '';
      const rowSel  = selectedIds.has(m.id) ? 'row-selected' : '';
      return `<tr class="${rowSel}" id="row-${m.id}">
        ${canEdit ? `<td class="cb-col"><input type="checkbox" class="form-check-input row-cb" data-id="${m.id}" ${checked} onchange="toggleRow(${m.id},this.checked)"></td>` : ''}
        <td data-label="Ime"><a href="detail.html?id=${m.id}" class="fw-semibold text-decoration-none">${m.name}</a></td>
        <td data-label="Broj članske"><code>${m.membership_number || '-'}</code></td>
        <td data-label="E-mail" class="text-muted small">${m.email}</td>
        <td data-label="Telefon">${m.phone || '-'}</td>
        <td data-label="Selekcija"><span class="badge bg-secondary bg-opacity-10 text-secondary">${selName}</span></td>
        <td data-label="Učlanjen">${formatDate(m.join_date)}</td>
        <td data-label="Status">${statusBadge(m.status)}</td>
        <td>
          <a href="detail.html?id=${m.id}" class="btn btn-sm btn-outline-secondary me-1" title="Profil"><i class="bi bi-eye"></i></a>
          <a href="../players/stats.html?id=${m.id}&name=${encodeURIComponent(m.name)}" class="btn btn-sm btn-outline-primary me-1" title="Statistike"><i class="bi bi-bar-chart-line"></i></a>
          ${canEdit ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteMember(${m.id})"><i class="bi bi-trash"></i></button>` : ''}
        </td>
      </tr>`;
    }).join('') :
    `<tr><td colspan="${colCount}" class="text-center py-5 text-muted"><i class="bi bi-inbox fs-2 d-block mb-2"></i>Nema pronađenih članova</td></tr>`;

    renderPagination(pages);
    syncSelectAll();
  }

  function renderPagination(pages) {
    const pag = document.getElementById('pagination');
    if (pages <= 1) { pag.innerHTML = ''; return; }
    let html = `<li class="page-item ${currentPage===1?'disabled':''}"><a class="page-link" href="#" onclick="goPage(${currentPage-1})">‹</a></li>`;
    for (let i = 1; i <= pages; i++) {
      if (pages > 7 && Math.abs(i - currentPage) > 2 && i !== 1 && i !== pages) {
        if (i === 2 || i === pages - 1) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        continue;
      }
      html += `<li class="page-item ${i===currentPage?'active':''}"><a class="page-link" href="#" onclick="goPage(${i})">${i}</a></li>`;
    }
    html += `<li class="page-item ${currentPage===pages?'disabled':''}"><a class="page-link" href="#" onclick="goPage(${currentPage+1})">›</a></li>`;
    pag.innerHTML = html;
  }

  function goPage(p) { currentPage = p; renderTable(); return false; }

  /* ── Selection checkboxes ── */
  function toggleRow(id, checked) {
    checked ? selectedIds.add(id) : selectedIds.delete(id);
    const row = document.getElementById('row-' + id);
    if (row) row.classList.toggle('row-selected', checked);
    updateBulkBar();
    syncSelectAll();
  }

  function toggleSelectAll(checked) {
    filtered().forEach(m => {
      checked ? selectedIds.add(m.id) : selectedIds.delete(m.id);
    });
    renderTable();
    updateBulkBar();
  }

  function syncSelectAll() {
    const vis = filtered();
    const allChecked = vis.length > 0 && vis.every(m => selectedIds.has(m.id));
    const sa = document.getElementById('selectAll');
    if (sa) { sa.checked = allChecked; sa.indeterminate = !allChecked && vis.some(m => selectedIds.has(m.id)); }
  }

  function clearSelection() { selectedIds.clear(); renderTable(); updateBulkBar(); }

  function updateBulkBar() {
    const bar   = document.getElementById('bulkBar');
    const count = selectedIds.size;
    document.getElementById('bulkCount').textContent = count;
    bar.classList.toggle('d-none', count === 0);
  }

  function getSelectedIds() { return Array.from(selectedIds); }

  /* ── Bulk actions ── */
  async function bulkStatus(status) {
    const ids = getSelectedIds();
    if (!ids.length) return;
    try {
      await apiPost('/members/bulk', { ids, action: 'status', value: status });
      showToast(`Status ažuriran za ${ids.length} članova`);
      clearSelection(); load();
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function bulkSelection(selId) {
    const ids = getSelectedIds();
    if (!ids.length) return;
    try {
      await apiPost('/members/bulk', { ids, action: 'selection', value: selId });
      showToast(`Selekcija dodijeljena za ${ids.length} članova`);
      clearSelection(); load();
    } catch(e) { showToast(e.message, 'error'); }
  }

  async function bulkDelete() {
    const ids = getSelectedIds();
    if (!ids.length) return;
    confirmAction(`Obrisati ${ids.length} odabranih članova? Ova akcija se ne može poništiti.`, async () => {
      try {
        await apiPost('/members/bulk', { ids, action: 'delete' });
        showToast(`Obrisano ${ids.length} članova`);
        clearSelection(); load();
      } catch(e) { showToast(e.message, 'error'); }
    });
  }

  function resetFilters() {
    ['search','fJoinFrom','fJoinTo'].forEach(id => document.getElementById(id).value = '');
    ['fStatus','fSelection'].forEach(id => document.getElementById(id).value = '');
    currentPage = 1;
    renderTable();
  }

  async function deleteMember(id) {
    confirmDelete(async () => {
      try { await apiDelete('/members/' + id); showToast('Član obrisan'); load(); }
      catch(e) { showToast(e.message, 'error'); }
    });
  }

  load();
</script>
</body>
</html>
