<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Članarine | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <style>
    .fee-bulk-bar { background:#10b981;color:#fff;border-radius:10px;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap; }
    .fee-bulk-bar .count-pill { background:rgba(255,255,255,.25);border-radius:999px;padding:.15em .65em;font-weight:700;font-size:.85rem; }
    #tableBody tr.row-selected { background:rgba(16,185,129,.07); }
    .cb-col { width:36px; }
  </style>
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Članarine</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">

    <div class="page-header d-flex justify-content-between align-items-center">
      <div><h4>Članarine</h4><p class="text-muted mb-0">Praćenje uplata članova</p></div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-warning btn-sm" onclick="checkReminders()">
          <i class="bi bi-bell me-1"></i>Provjeri podsjetnike
        </button>
        <a href="add.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Dodaj</a>
      </div>
    </div>

    <!-- Stats cards -->
    <div class="row g-3 mb-4" id="statsRow">
      <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-success bg-opacity-10 flex-shrink-0"><i class="bi bi-check-circle text-success fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Naplaćeno</div><div class="stat-kpi-value" id="sPaid">-</div></div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-warning bg-opacity-10 flex-shrink-0"><i class="bi bi-clock text-warning fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Na čekanju</div><div class="stat-kpi-value" id="sPending">-</div></div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-danger bg-opacity-10 flex-shrink-0"><i class="bi bi-exclamation-circle text-danger fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Zakašnjelo</div><div class="stat-kpi-value" id="sOverdue">-</div></div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-primary bg-opacity-10 flex-shrink-0"><i class="bi bi-cash text-primary fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Ukupni prihod</div><div class="stat-kpi-value" id="sTotal">-</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bulk action bar -->
    <div id="feeBulkBar" class="fee-bulk-bar mb-3 d-none">
      <span class="count-pill" id="feeBulkCount">0</span>
      <span>odabranih</span>
      <div class="d-flex gap-2 flex-wrap ms-auto">
        <button class="btn btn-sm btn-light" onclick="bulkMarkFeesPaid()"><i class="bi bi-check-lg me-1"></i>Označi plaćeno</button>
        <button class="btn btn-sm btn-danger" onclick="bulkDeleteFees()"><i class="bi bi-trash me-1"></i>Obriši</button>
        <button class="btn btn-sm btn-outline-light" onclick="clearFeeSelection()"><i class="bi bi-x"></i></button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-sm-6 col-lg-3">
          <input type="text" class="form-control form-control-sm" id="fSearch"
            placeholder="Pretraži člana..." oninput="feePage=1;renderTable()"
            autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
        </div>
        <div class="col-6 col-sm-auto">
          <select class="form-select form-select-sm" id="fStatus" onchange="feePage=1;renderTable()">
            <option value="">Svi statusi</option>
            <option value="paid">Plaćeno</option>
            <option value="pending">Na čekanju</option>
            <option value="overdue">Zakašnjelo</option>
          </select>
        </div>
        <div class="col-6 col-sm-auto">
          <input type="date" class="form-control form-control-sm" id="fFrom" onchange="feePage=1;renderTable()" title="Dospijeće od">
        </div>
        <div class="col-6 col-sm-auto">
          <input type="date" class="form-control form-control-sm" id="fTo" onchange="feePage=1;renderTable()" title="Dospijeće do">
        </div>
        <div class="col-6 col-sm-auto">
          <input type="number" class="form-control form-control-sm" id="fAmtMin"
            placeholder="Min KM" min="0" step="1" oninput="feePage=1;renderTable()">
        </div>
        <div class="col-6 col-sm-auto">
          <input type="number" class="form-control form-control-sm" id="fAmtMax"
            placeholder="Max KM" min="0" step="1" oninput="feePage=1;renderTable()">
        </div>
        <div class="col-auto">
          <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()" title="Resetuj filtere">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card table-card">
      <div class="card-header d-flex justify-content-between align-items-center py-2">
        <span class="fw-semibold small"><i class="bi bi-cash-coin me-2 text-success"></i>Članarine</span>
        <span class="text-muted small" id="feeCount"></span>
      </div>
      <div class="table-responsive">
        <table class="table table-hover mb-0 table-mobile-cards">
          <thead>
            <tr>
              <th class="cb-col"><input type="checkbox" class="form-check-input" id="feeSelectAll" onchange="toggleFeeSelectAll(this.checked)"></th>
              <th>Član</th>
              <th>Period</th>
              <th>Iznos</th>
              <th>Dospijeće</th>
              <th>Plaćeno dana</th>
              <th>Status</th>
              <th>Akcije</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" class="p-2"><span class="skeleton sk-row"></span></td></tr>
            <tr><td colspan="8" class="p-2"><span class="skeleton sk-row"></span></td></tr>
            <tr><td colspan="8" class="p-2"><span class="skeleton sk-row"></span></td></tr>
            <tr><td colspan="8" class="p-2"><span class="skeleton sk-row" style="width:80%"></span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer bg-transparent d-flex justify-content-center py-2">
        <nav><ul class="pagination pagination-sm mb-0" id="feePagination"></ul></nav>
      </div>
    </div>

  </div>
</div>
<!-- Quick-edit modal -->
<div class="modal fade" id="feeEditModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:14px;overflow:hidden;">
      <div class="modal-header border-0 pb-1">
        <h5 class="modal-title fw-bold"><i class="bi bi-pencil me-2"></i>Uredi članarinu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editFeeId">
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label">Iznos (KM)</label>
            <input type="number" class="form-control" id="editFeeAmount" step="0.01" min="0">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Status</label>
            <select class="form-select" id="editFeeStatus">
              <option value="pending">Na čekanju</option>
              <option value="paid">Plaćeno</option>
              <option value="overdue">Zakašnjelo</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Rok dospijeća</label>
            <input type="date" class="form-control" id="editFeeDueDate">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Datum plaćanja</label>
            <input type="date" class="form-control" id="editFeePaidDate">
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 pt-1">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Odustani</button>
        <button type="button" class="btn btn-primary" id="saveFeeEditBtn" onclick="saveQuickEditFee()">
          <span id="editFeeSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
          Sačuvaj
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
const user = requireRole('super_admin','admin');
setUserInfo(user);
buildSidebar();

let allFees = [];
const FEE_PAGE_SIZE = 20;
let feePage = 1;
let selectedFeeIds = new Set();

async function load() {
  try {
    const [fees, stats] = await Promise.all([apiGet('/fees'), apiGet('/fees/stats')]);
    allFees = fees;
    document.getElementById('sPaid').textContent    = stats.paid    != null ? stats.paid    + ' članarina' : '-';
    document.getElementById('sPending').textContent = stats.pending != null ? stats.pending + ' članarina' : '-';
    document.getElementById('sOverdue').textContent = stats.overdue != null ? stats.overdue + ' članarina' : '-';
    document.getElementById('sTotal').textContent   = Number(stats.total_collected || 0).toFixed(2) + ' KM';
    feePage = 1;
    renderTable();
  } catch(e) { showToast(e.message, 'error'); }
}

function filtered() {
  const q   = (document.getElementById('fSearch').value || '').toLowerCase();
  const st  = document.getElementById('fStatus').value;
  const fr  = document.getElementById('fFrom').value;
  const to  = document.getElementById('fTo').value;
  const min = parseFloat(document.getElementById('fAmtMin').value) || 0;
  const max = parseFloat(document.getElementById('fAmtMax').value) || Infinity;
  return allFees.filter(f => {
    const dd = (f.due_date || '').slice(0,10);
    const amt = parseFloat(f.amount || 0);
    return (
      (!q  || (f.member_name||'').toLowerCase().includes(q)) &&
      (!st || f.status === st) &&
      (!fr || dd >= fr) &&
      (!to || dd <= to) &&
      amt >= min && amt <= max
    );
  });
}

function renderTable() {
  const rows  = filtered();
  const anyFilter = document.getElementById('fSearch').value || document.getElementById('fStatus').value ||
    document.getElementById('fFrom').value || document.getElementById('fTo').value ||
    document.getElementById('fAmtMin').value || document.getElementById('fAmtMax').value;
  const pages = Math.ceil(rows.length / FEE_PAGE_SIZE) || 1;
  if (feePage > pages) feePage = 1;
  const slice = rows.slice((feePage - 1) * FEE_PAGE_SIZE, feePage * FEE_PAGE_SIZE);
  document.getElementById('feeCount').textContent = rows.length + ' zapisa';
  document.getElementById('tableBody').innerHTML = slice.length ? slice.map(f => {
    const checked = selectedFeeIds.has(f.id) ? 'checked' : '';
    const rowSel  = selectedFeeIds.has(f.id) ? 'row-selected' : '';
    return `
    <tr id="fee-row-${f.id}" class="${rowSel}">
      <td class="cb-col"><input type="checkbox" class="form-check-input" data-id="${f.id}" ${checked} onchange="toggleFeeRow(${f.id},this.checked)"></td>
      <td data-label="Član" class="fw-semibold">${f.member_name}</td>
      <td data-label="Period" class="small text-muted">${formatDate(f.period_start)} – ${formatDate(f.period_end)}</td>
      <td data-label="Iznos" class="fw-semibold">${parseFloat(f.amount).toFixed(2)} KM</td>
      <td data-label="Dospijeće">${formatDate(f.due_date)}</td>
      <td data-label="Plaćeno">${f.paid_date ? formatDate(f.paid_date) : '-'}</td>
      <td data-label="Status">${statusBadge(f.status)}</td>
      <td>
        ${f.status !== 'paid' ? `<button class="btn btn-sm btn-success me-1" onclick="markPaid(${f.id})" title="Označi plaćeno"><i class="bi bi-check-lg"></i></button>` : ''}
        ${f.status !== 'paid' ? `<button class="btn btn-sm btn-outline-warning me-1" onclick="sendFeeReminder(${f.id})" title="Pošalji podsjetnik"><i class="bi bi-bell"></i></button>` : ''}
        <button class="btn btn-sm btn-outline-secondary me-1" onclick="quickEditFee(${f.id})" title="Uredi"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteFee(${f.id})" title="Obriši"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`;
  }).join('') :
  `<tr><td colspan="8" class="text-center py-5">
    <i class="bi bi-${anyFilter ? 'search' : 'cash-coin'} fs-2 d-block mb-2 text-muted opacity-25"></i>
    <div class="fw-semibold text-muted mb-1">${anyFilter ? 'Nema pronađenih članarina' : 'Još nema unesenih članarina'}</div>
    <div class="small text-muted">${anyFilter ? 'Prilagodite filtere za pretragu.' : 'Dodajte prvu članarinu kluba.'}</div>
    ${!anyFilter ? '<a href="add.html" class="btn btn-sm btn-primary mt-2"><i class="bi bi-plus-lg me-1"></i>Dodaj članarinu</a>' : ''}
  </td></tr>`;
  syncFeeSelectAll();
  renderFeePagination(pages);
}

function renderFeePagination(pages) {
  const ul = document.getElementById('feePagination');
  if (pages <= 1) { ul.innerHTML = ''; return; }
  const range = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || (i >= feePage - 2 && i <= feePage + 2)) range.push(i);
    else if (range[range.length - 1] !== '…') range.push('…');
  }
  ul.innerHTML = `
    <li class="page-item ${feePage===1?'disabled':''}"><a class="page-link" href="#" onclick="goFeePage(${feePage-1});return false;">&laquo;</a></li>
    ${range.map(p => p === '…'
      ? `<li class="page-item disabled"><span class="page-link">…</span></li>`
      : `<li class="page-item ${p===feePage?'active':''}"><a class="page-link" href="#" onclick="goFeePage(${p});return false;">${p}</a></li>`
    ).join('')}
    <li class="page-item ${feePage===pages?'disabled':''}"><a class="page-link" href="#" onclick="goFeePage(${feePage+1});return false;">&raquo;</a></li>`;
}

function goFeePage(p) { feePage = p; renderTable(); window.scrollTo(0, 0); }

function resetFilters() {
  ['fSearch','fFrom','fTo','fAmtMin','fAmtMax'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fStatus').value = '';
  feePage = 1;
  renderTable();
}

async function markPaid(id) {
  try { await apiPut('/fees/' + id + '/pay', { payment_method: 'cash' }); showToast('Označeno kao plaćeno'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}

async function deleteFee(id) {
  confirmDelete(async () => {
    try { await apiDelete('/fees/' + id); showToast('Članarina obrisana'); load(); }
    catch(e) { showToast(e.message, 'error'); }
  });
}

async function checkReminders() {
  try { const r = await apiPost('/reminders/check-fees', {}); showToast(r.message, 'success'); }
  catch(e) { showToast(e.message, 'error'); }
}

/* ── Bulk selection ── */
function toggleFeeRow(id, checked) {
  checked ? selectedFeeIds.add(id) : selectedFeeIds.delete(id);
  const row = document.getElementById('fee-row-' + id);
  if (row) row.classList.toggle('row-selected', checked);
  updateFeeBulkBar(); syncFeeSelectAll();
}
function toggleFeeSelectAll(checked) {
  filtered().forEach(f => checked ? selectedFeeIds.add(f.id) : selectedFeeIds.delete(f.id));
  renderTable(); updateFeeBulkBar();
}
function syncFeeSelectAll() {
  const vis = filtered();
  const sa = document.getElementById('feeSelectAll');
  if (!sa) return;
  sa.checked = vis.length > 0 && vis.every(f => selectedFeeIds.has(f.id));
  sa.indeterminate = !sa.checked && vis.some(f => selectedFeeIds.has(f.id));
}
function clearFeeSelection() { selectedFeeIds.clear(); renderTable(); updateFeeBulkBar(); }
function updateFeeBulkBar() {
  document.getElementById('feeBulkCount').textContent = selectedFeeIds.size;
  document.getElementById('feeBulkBar').classList.toggle('d-none', selectedFeeIds.size === 0);
}

/* ── Bulk actions ── */
async function bulkMarkFeesPaid() {
  const ids = Array.from(selectedFeeIds);
  if (!ids.length) return;
  confirmAction(`Označiti ${ids.length} članarina kao plaćene?`, async () => {
    try {
      await Promise.all(ids.map(id => apiPut('/fees/' + id + '/pay', { payment_method: 'cash' })));
      showToast(`${ids.length} članarina označeno kao plaćeno`, 'success');
      clearFeeSelection(); load();
    } catch(e) { showToast(e.message, 'error'); }
  }, { title: 'Bulk plaćanje', btnLabel: 'Označi plaćeno', btnClass: 'btn-success' });
}
async function bulkDeleteFees() {
  const ids = Array.from(selectedFeeIds);
  if (!ids.length) return;
  confirmDelete(async () => {
    try {
      await Promise.all(ids.map(id => apiDelete('/fees/' + id)));
      showToast(`${ids.length} članarina obrisano`, 'success');
      clearFeeSelection(); load();
    } catch(e) { showToast(e.message, 'error'); }
  }, `Obrisati ${ids.length} odabranih članarina? Ova radnja je nepovratna.`);
}

/* ── Quick edit ── */
function quickEditFee(id) {
  const f = allFees.find(f => f.id === id);
  if (!f) return;
  document.getElementById('editFeeId').value     = id;
  document.getElementById('editFeeAmount').value = parseFloat(f.amount).toFixed(2);
  document.getElementById('editFeeStatus').value = f.status;
  document.getElementById('editFeeDueDate').value  = f.due_date  ? f.due_date.slice(0,10)  : '';
  document.getElementById('editFeePaidDate').value = f.paid_date ? f.paid_date.slice(0,10) : '';
  new bootstrap.Modal(document.getElementById('feeEditModal')).show();
}
async function saveQuickEditFee() {
  const id = document.getElementById('editFeeId').value;
  const btn = document.getElementById('saveFeeEditBtn');
  const sp  = document.getElementById('editFeeSpinner');
  btn.disabled = true; sp.classList.remove('d-none');
  try {
    await apiPut('/fees/' + id, {
      amount:    parseFloat(document.getElementById('editFeeAmount').value),
      status:    document.getElementById('editFeeStatus').value,
      due_date:  document.getElementById('editFeeDueDate').value  || null,
      paid_date: document.getElementById('editFeePaidDate').value || null,
    });
    bootstrap.Modal.getInstance(document.getElementById('feeEditModal')).hide();
    showToast('Članarina ažurirana', 'success'); load();
  } catch(e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; sp.classList.add('d-none'); }
}

/* ── Per-row reminder ── */
async function sendFeeReminder(id) {
  try {
    const r = await apiPost('/reminders/send-fee/' + id, {});
    showToast(r.message || 'Podsjetnik poslan', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

load();
</script>
</body>
</html>
