<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <script src="/assets/js/cookie-consent.js" defer></script>
  <title>Pregled plaćanja | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Pregled plaćanja</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-danger" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">
    <div class="page-header">
      <h4>Ko je platio članarinu</h4>
      <p class="text-muted mb-0">Koliko igrača je platilo članarinu za izabrani period - po selekciji ili po treneru.</p>
    </div>

    <div class="card mb-3">
      <div class="card-body d-flex flex-wrap align-items-end gap-3">
        <div>
          <label class="form-label small mb-1">Period od</label>
          <input type="date" class="form-control form-control-sm" id="periodStart">
        </div>
        <div>
          <label class="form-label small mb-1">Period do</label>
          <input type="date" class="form-control form-control-sm" id="periodEnd">
        </div>
        <button class="btn btn-sm btn-primary" onclick="loadOverview()"><i class="bi bi-search me-1"></i>Prikaži</button>
        <div class="btn-group ms-auto" role="group">
          <button type="button" class="btn btn-sm btn-outline-primary active" id="viewBtn_selection" onclick="setView('selection')">Po selekciji</button>
          <button type="button" class="btn btn-sm btn-outline-primary" id="viewBtn_coach" onclick="setView('coach')">Po treneru</button>
        </div>
      </div>
    </div>

    <div id="emptyState" class="empty-state d-none">
      <i class="bi bi-cash-coin empty-state-icon"></i>
      <p class="text-muted">Nema generisanih članarina za izabrani period - prvo generišite članarine na stranici <a href="/pages/fees/list.html">Članarine</a>.</p>
    </div>

    <div class="row g-3" id="cards"></div>
  </div>
</div>

<!-- Drill-down modal -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detailTitle">Detalji</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-6">
            <h6 class="small text-success fw-bold text-uppercase"><i class="bi bi-check-circle me-1"></i>Platili</h6>
            <ul class="list-group list-group-flush mb-3" id="paidList"></ul>
          </div>
          <div class="col-md-6">
            <h6 class="small text-danger fw-bold text-uppercase"><i class="bi bi-x-circle me-1"></i>Nisu platili</h6>
            <ul class="list-group list-group-flush mb-3" id="unpaidList"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
const user = requireRole('admin');
setUserInfo(user);
buildSidebar();

const STATUS_LABEL = { paid: 'Plaćeno', pending: 'Na čekanju', overdue: 'Zakašnjelo', no_fee: 'Nije generisano' };
const STATUS_BADGE = { paid: 'success', pending: 'warning', overdue: 'danger', no_fee: 'secondary' };

let overviewData = { selections: [], coaches: [] };
let currentView = 'selection';

function escHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('bs-BA') : '-'; }

function setView(view) {
  currentView = view;
  document.getElementById('viewBtn_selection').classList.toggle('active', view === 'selection');
  document.getElementById('viewBtn_coach').classList.toggle('active', view === 'coach');
  render();
}

// Normalizes either a selection-row or coach-row into the same shape the card/modal need.
function normalize(row) {
  return currentView === 'selection'
    ? { id: row.selection_id, name: row.selection_name, subtitle: row.coach_names || 'Nema dodijeljenog trenera', total: row.total, paid: row.paid, percent_paid: row.percent_paid, members: row.members }
    : { id: row.coach_id, name: row.coach_name, subtitle: row.selection_names || '-', total: row.total, paid: row.paid, percent_paid: row.percent_paid, members: row.members };
}

function cardHtml(row) {
  const r = normalize(row);
  const barColor = r.percent_paid >= 80 ? 'bg-success' : r.percent_paid >= 50 ? 'bg-warning' : 'bg-danger';
  return `
    <div class="col-md-6 col-lg-4">
      <div class="card h-100" style="cursor:pointer;" onclick='openDetail(${JSON.stringify(String(r.id))})'>
        <div class="card-body">
          <h6 class="fw-bold mb-1">${escHtml(r.name)}</h6>
          <p class="small text-muted mb-2">${escHtml(r.subtitle)}</p>
          <div class="progress mb-2" style="height:8px;">
            <div class="progress-bar ${barColor}" style="width:${r.percent_paid}%"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="small text-muted">${r.paid} / ${r.total} platilo</span>
            <span class="fw-bold">${r.percent_paid}%</span>
          </div>
        </div>
      </div>
    </div>`;
}

function render() {
  const rows = currentView === 'selection' ? overviewData.selections : overviewData.coaches;
  document.getElementById('cards').innerHTML = (rows || []).map(cardHtml).join('');
}

async function loadOverview() {
  try {
    const ps = document.getElementById('periodStart').value;
    const pe = document.getElementById('periodEnd').value;
    const qs = (ps && pe) ? `?period_start=${ps}&period_end=${pe}` : '';
    overviewData = await apiGet('/fees/overview' + qs);
    const empty = document.getElementById('emptyState');
    if (!overviewData.period_start) {
      empty.classList.remove('d-none');
      document.getElementById('cards').innerHTML = '';
      return;
    }
    empty.classList.add('d-none');
    if (!ps) document.getElementById('periodStart').value = overviewData.period_start;
    if (!pe) document.getElementById('periodEnd').value = overviewData.period_end;
    render();
  } catch (e) { showToast(e.message, 'error'); }
}

function openDetail(id) {
  const rows = currentView === 'selection' ? overviewData.selections : overviewData.coaches;
  const raw = rows.find(x => String(currentView === 'selection' ? x.selection_id : x.coach_id) === id);
  if (!raw) return;
  const r = normalize(raw);
  document.getElementById('detailTitle').textContent = r.name + ' - ' + fmtDate(overviewData.period_start) + ' do ' + fmtDate(overviewData.period_end);
  const paid = r.members.filter(m => m.status === 'paid');
  const unpaid = r.members.filter(m => m.status !== 'paid');
  document.getElementById('paidList').innerHTML = paid.map(m => `
    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
      <span>${escHtml(m.name)}</span>
      <span class="small text-muted">${m.amount ? Number(m.amount).toFixed(2) + ' KM' : ''}</span>
    </li>`).join('') || '<li class="list-group-item px-0 text-muted small">Nema</li>';
  document.getElementById('unpaidList').innerHTML = unpaid.map(m => `
    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
      <span>${escHtml(m.name)}</span>
      <span class="badge bg-${STATUS_BADGE[m.status]}-subtle text-${STATUS_BADGE[m.status]}-emphasis small">${STATUS_LABEL[m.status]}</span>
    </li>`).join('') || '<li class="list-group-item px-0 text-muted small">Nema</li>';
  bootstrap.Modal.getOrCreateInstance(document.getElementById('detailModal')).show();
}

loadOverview();
</script>
</body>
</html>
