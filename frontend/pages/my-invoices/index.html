<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moje fakture | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Moje fakture</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">
    <div class="page-header">
      <h4>Moje fakture</h4>
      <p class="text-muted mb-0">Historija faktura za vaš klub.</p>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-sm-4">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-success bg-opacity-10 flex-shrink-0"><i class="bi bi-check-circle text-success fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Plaćene</div><div class="stat-kpi-value" id="kPaid">-</div></div>
          </div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-warning bg-opacity-10 flex-shrink-0"><i class="bi bi-clock text-warning fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Neplaćene</div><div class="stat-kpi-value" id="kUnpaid">-</div></div>
          </div>
        </div>
      </div>
      <div class="col-sm-4">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-danger bg-opacity-10 flex-shrink-0"><i class="bi bi-exclamation-triangle text-danger fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">U kašnjenju</div><div class="stat-kpi-value" id="kOverdue">-</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body py-2">
        <select class="form-select form-select-sm w-auto" id="filterStatus" onchange="renderTable()">
          <option value="">Svi statusi</option>
          <option value="paid">Plaćena</option>
          <option value="unpaid">Neplaćena</option>
          <option value="overdue">U kašnjenju</option>
        </select>
      </div>
    </div>

    <div class="card table-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0 table-mobile-cards">
          <thead><tr><th>Br. fakture</th><th>Iznos</th><th>Status</th><th>Rok</th><th>Plaćeno</th><th>Period</th><th>Napomene</th></tr></thead>
          <tbody id="invTable">
            <tr class="sk-row"><td><div class="skeleton" style="height:13px;width:90px;"></div></td><td><div class="skeleton" style="height:13px;width:60px;"></div></td><td><div class="skeleton" style="height:20px;width:65px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:13px;width:80%;"></div></td><td><div class="skeleton" style="height:13px;width:60%;"></div></td></tr>
            <tr class="sk-row"><td><div class="skeleton" style="height:13px;width:90px;"></div></td><td><div class="skeleton" style="height:13px;width:60px;"></div></td><td><div class="skeleton" style="height:20px;width:65px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:13px;width:70%;"></div></td><td><div class="skeleton" style="height:13px;width:50%;"></div></td></tr>
            <tr class="sk-row"><td><div class="skeleton" style="height:13px;width:90px;"></div></td><td><div class="skeleton" style="height:13px;width:60px;"></div></td><td><div class="skeleton" style="height:20px;width:65px;border-radius:999px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:13px;width:70px;"></div></td><td><div class="skeleton" style="height:13px;width:75%;"></div></td><td><div class="skeleton" style="height:13px;width:55%;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
const user = requireRole('admin', 'super_admin');
setUserInfo(user); buildSidebar();

let allInv = [];
const STATUS_BADGE = {
  paid:    '<span class="badge bg-success">Plaćena</span>',
  unpaid:  '<span class="badge bg-warning text-dark">Neplaćena</span>',
  overdue: '<span class="badge bg-danger">U kašnjenju</span>'
};
const fmt  = n => parseFloat(n || 0).toFixed(2) + ' KM';
const fmtD = d => d ? new Date(d).toLocaleDateString('bs-BA') : '-';

async function load() {
  try {
    allInv = await apiGet('/invoices/mine');
    document.getElementById('kPaid').textContent    = allInv.filter(i => i.status === 'paid').length;
    document.getElementById('kUnpaid').textContent  = allInv.filter(i => i.status === 'unpaid').length;
    document.getElementById('kOverdue').textContent = allInv.filter(i => i.status === 'overdue').length;
    renderTable();
  } catch(e) { showToast(e.message, 'error'); }
}

function renderTable() {
  const st = document.getElementById('filterStatus').value;
  const rows = allInv.filter(i => !st || i.status === st);
  document.getElementById('invTable').innerHTML = rows.map(i => `
    <tr>
      <td data-label="Br. fakture" class="fw-semibold small">${i.invoice_number}</td>
      <td data-label="Iznos" class="fw-semibold">${fmt(i.amount)}</td>
      <td data-label="Status">${STATUS_BADGE[i.status] || i.status}</td>
      <td data-label="Rok" class="small">${fmtD(i.due_date)}</td>
      <td data-label="Plaćeno" class="small">${fmtD(i.paid_date)}</td>
      <td data-label="Period" class="small text-muted">${i.period_start ? fmtD(i.period_start) + ' – ' + fmtD(i.period_end) : '-'}</td>
      <td data-label="Napomene" class="small text-muted">${i.notes || '-'}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="text-center text-muted py-3">Nema faktura</td></tr>';
}

load();
</script>
</body>
</html>
