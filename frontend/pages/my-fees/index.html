<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <script src="/assets/js/cookie-consent.js" defer></script>
  <title>Moje članarine | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Moje članarine</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">
    <div class="page-header">
      <h4>Moje članarine</h4>
      <p class="text-muted mb-0">Pregled vaših uplata članarine.</p>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-success bg-opacity-10 flex-shrink-0"><i class="bi bi-check-circle text-success fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Plaćeno</div><div class="stat-kpi-value" id="sPaid">-</div></div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-warning bg-opacity-10 flex-shrink-0"><i class="bi bi-clock text-warning fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Na čekanju</div><div class="stat-kpi-value" id="sPending">-</div></div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-danger bg-opacity-10 flex-shrink-0"><i class="bi bi-exclamation-circle text-danger fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Zakašnjelo</div><div class="stat-kpi-value" id="sOverdue">-</div></div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="stat-icon bg-primary bg-opacity-10 flex-shrink-0"><i class="bi bi-cash text-primary fs-5"></i></div>
            <div class="min-w-0"><div class="stat-kpi-label">Preostalo za platiti</div><div class="stat-kpi-value" id="sOutstanding">-</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body py-2">
        <select class="form-select form-select-sm w-auto" id="filterStatus" onchange="renderTable()">
          <option value="">Svi statusi</option>
          <option value="paid">Plaćeno</option>
          <option value="pending">Na čekanju</option>
          <option value="overdue">Zakašnjelo</option>
        </select>
      </div>
    </div>

    <div class="card table-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0 table-mobile-cards">
          <thead><tr><th>Period</th><th>Iznos</th><th>Status</th><th>Rok uplate</th><th>Plaćeno dana</th><th>Napomene</th></tr></thead>
          <tbody id="tableBody">
            <tr><td colspan="6" class="p-2"><span class="skeleton sk-row"></span></td></tr>
            <tr><td colspan="6" class="p-2"><span class="skeleton sk-row"></span></td></tr>
            <tr><td colspan="6" class="p-2"><span class="skeleton sk-row" style="width:80%"></span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
const user = requireRole('member');
setUserInfo(user); buildSidebar();

let allFees = [];
const STATUS_BADGE = {
  paid:    '<span class="badge bg-success">Plaćeno</span>',
  pending: '<span class="badge bg-warning text-dark">Na čekanju</span>',
  overdue: '<span class="badge bg-danger">Zakašnjelo</span>'
};
const fmt  = n => parseFloat(n || 0).toFixed(2) + ' KM';
const fmtD = d => d ? new Date(d).toLocaleDateString('bs-BA') : '-';

async function load() {
  try {
    const profile = await apiGet('/members/my-profile');
    allFees = profile.fees || [];

    const paid     = allFees.filter(f => f.status === 'paid');
    const pending   = allFees.filter(f => f.status === 'pending');
    const overdue   = allFees.filter(f => f.status === 'overdue');
    const outstanding = [...pending, ...overdue].reduce((sum, f) => sum + parseFloat(f.amount || 0), 0);

    document.getElementById('sPaid').textContent        = paid.length;
    document.getElementById('sPending').textContent     = pending.length;
    document.getElementById('sOverdue').textContent      = overdue.length;
    document.getElementById('sOutstanding').textContent = fmt(outstanding);

    renderTable();
  } catch(e) { showToast(e.message, 'error'); }
}

function renderTable() {
  const st = document.getElementById('filterStatus').value;
  const rows = allFees.filter(f => !st || f.status === st);
  document.getElementById('tableBody').innerHTML = rows.map(f => `
    <tr>
      <td data-label="Period" class="small">${f.period_start ? fmtD(f.period_start) + ' - ' + fmtD(f.period_end) : '-'}</td>
      <td data-label="Iznos" class="fw-semibold">${fmt(f.amount)}</td>
      <td data-label="Status">${STATUS_BADGE[f.status] || f.status}</td>
      <td data-label="Rok uplate" class="small">${fmtD(f.due_date)}</td>
      <td data-label="Plaćeno dana" class="small">${fmtD(f.paid_date)}</td>
      <td data-label="Napomene" class="small text-muted">${escHtml(f.notes) || '-'}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="text-center text-muted py-3">Nema članarina</td></tr>';
}

load();
</script>
</body>
</html>
