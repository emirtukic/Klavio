<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zakaži termin | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Zakaži termin</span>
    <div class="d-flex align-items-center gap-2"><span class="badge bg-success" id="userRole"></span><span class="fw-semibold small" id="userName"></span></div>
  </div>
  <div class="page-body">
    <div class="page-header d-flex align-items-center gap-2">
      <a href="list.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h4 class="mb-0">Zakaži termin s trenerom</h4>
    </div>
    <div class="card form-card">
      <div class="card-body p-4">
        <div id="alert" class="alert alert-danger d-none"></div>
        <form id="form">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Trener *</label>
              <select class="form-select" name="coach_id" required><option value="">Učitavanje trenera...</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Naziv *</label>
              <input type="text" class="form-control" name="title" required placeholder="npr. Individualni trening">
            </div>
            <div class="col-md-4">
              <label class="form-label">Datum *</label>
              <input type="date" class="form-control" name="appointment_date" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Početak *</label>
              <input type="time" class="form-control" name="start_time" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Kraj *</label>
              <input type="time" class="form-control" name="end_time" required>
            </div>
            <div class="col-12">
              <label class="form-label">Napomena</label>
              <textarea class="form-control" name="notes" rows="2"></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary me-2">
                <span class="spinner-border spinner-border-sm d-none me-1" id="spinner"></span>Zakaži termin
              </button>
              <a href="list.html" class="btn btn-outline-secondary">Odustani</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
  const user = requireRole('member');
  setUserInfo(user);
  buildSidebar();
  apiGet('/coaches').then(coaches => {
    const sel = document.querySelector('select[name=coach_id]');
    sel.innerHTML = '<option value="">Odaberi trenera...</option>' + coaches.map(c => `<option value="${c.id}">${c.name} (${c.specialization || 'Opći'})</option>`).join('');
  }).catch(e => showToast(e.message, 'error'));
  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const spinner = document.getElementById('spinner');
    const alertEl = document.getElementById('alert');
    btn.disabled = true; spinner.classList.remove('d-none'); alertEl.classList.add('d-none');
    const fd = new FormData(e.target);
    const body = Object.fromEntries(fd.entries());
    Object.keys(body).forEach(k => { if (!body[k]) delete body[k]; });
    body.coach_id = parseInt(body.coach_id);
    try {
      await apiPost('/appointments', body);
      showToast('Termin zakazan! Čekanje potvrde.');
      setTimeout(() => window.location.href = 'list.html', 1500);
    } catch(err) {
      alertEl.textContent = err.message; alertEl.classList.remove('d-none');
      btn.disabled = false; spinner.classList.add('d-none');
    }
  });
</script>
</body>
</html>
