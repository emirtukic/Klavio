<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <script src="/assets/js/cookie-consent.js" defer></script>
  <title>Turniri | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Turniri</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">
    <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div><h4>Turniri</h4><p class="text-muted mb-0">Turniri, pozivnice i kotizacije po selekciji.</p></div>
      <a href="add.html" class="btn btn-primary"><i class="bi bi-plus me-1"></i>Novi turnir</a>
    </div>

    <div id="emptyState" class="empty-state d-none">
      <i class="bi bi-trophy empty-state-icon"></i>
      <p class="text-muted">Još nema turnira.</p>
    </div>

    <div class="row g-3" id="cards"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
const user = requireRole('super_admin', 'admin', 'coach');
setUserInfo(user); buildSidebar();

function fmtDate(d) { return d ? new Date(d).toLocaleDateString('bs-BA') : '-'; }

function statusBadge(t) {
  const today = new Date().toISOString().slice(0, 10);
  const start = (t.date_start || '').slice(0, 10);
  const end = (t.date_end || '').slice(0, 10);
  if (today < start) return '<span class="badge bg-info-subtle text-info-emphasis">Nadolazeći</span>';
  if (today > end) return '<span class="badge bg-secondary-subtle text-secondary-emphasis">Završen</span>';
  return '<span class="badge bg-success-subtle text-success-emphasis">U toku</span>';
}

function cardHtml(t) {
  return `
    <div class="col-md-6 col-lg-4">
      <a href="detail.html?id=${t.id}" class="text-decoration-none">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-1">
              <h6 class="fw-bold mb-0">${escHtml(t.name)}</h6>
              ${statusBadge(t)}
            </div>
            <p class="small text-muted mb-2">${escHtml(t.selection_name)} ${t.location ? '· ' + escHtml(t.location) : ''}</p>
            <p class="small text-muted mb-2"><i class="bi bi-calendar3 me-1"></i>${fmtDate(t.date_start)} - ${fmtDate(t.date_end)}</p>
            <div class="d-flex gap-3 small text-muted">
              <span><i class="bi bi-flag me-1"></i>${t.team_count} tim(ova)</span>
              <span><i class="bi bi-people me-1"></i>${t.confirmed_count}/${t.invited_count} dolazi</span>
            </div>
          </div>
        </div>
      </a>
    </div>`;
}

async function load() {
  try {
    const rows = await apiGet('/tournaments');
    document.getElementById('emptyState').classList.toggle('d-none', rows.length > 0);
    document.getElementById('cards').innerHTML = rows.map(cardHtml).join('');
  } catch (e) { showToast(e.message, 'error'); }
}

load();
</script>
</body>
</html>
