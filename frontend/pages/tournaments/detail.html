<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <script src="/assets/js/cookie-consent.js" defer></script>
  <title>Turnir | Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <style>
    .rsvp-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .rsvp-yes   { background:#f0fdf4; color:#166534; border:1px solid #86efac; }
    .rsvp-maybe { background:#fefce8; color:#854d0e; border:1px solid #fde68a; }
    .rsvp-no    { background:#fef2f2; color:#991b1b; border:1px solid #fca5a5; }
    .rsvp-pending { background:#f1f5f9; color:#64748b; border:1px solid #e2e8f0; }
  </style>
</head>
<body>
<div class="sidebar"></div>
<div class="main-content">
  <div class="topbar">
    <span class="topbar-title">Turnir</span>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary" id="userRole"></span>
      <span class="fw-semibold small" id="userName"></span>
    </div>
  </div>
  <div class="page-body">
    <div class="page-header d-flex align-items-center gap-2">
      <a href="list.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h4 class="mb-0" id="pageTitle">Turnir</h4>
      <button class="btn btn-sm btn-outline-danger ms-auto d-none" id="deleteBtn" onclick="removeTournament()"><i class="bi bi-trash"></i> Obriši turnir</button>
    </div>

    <div class="card mb-3"><div class="card-body" id="infoCard"></div></div>

    <div class="card mb-3">
      <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
        <span><i class="bi bi-trophy me-2 text-primary"></i>Utakmice turnira</span>
        <button class="btn btn-sm btn-outline-primary d-none" id="addMatchBtn" onclick="openAddMatch()"><i class="bi bi-plus me-1"></i>Dodaj utakmicu</button>
      </div>
      <div class="list-group list-group-flush" id="matchesList"></div>
    </div>

    <div class="card mb-3 d-none" id="inviteCard">
      <div class="card-header bg-white fw-bold"><i class="bi bi-people me-2 text-primary"></i>Pozovi igrače</div>
      <div class="card-body">
        <div id="invitePicker" class="row g-2 mb-2"></div>
        <button class="btn btn-sm btn-primary" onclick="sendInvites()"><i class="bi bi-send me-1"></i>Pošalji pozivnice</button>
      </div>
    </div>

    <div class="card mb-3 d-none" id="rsvpCard">
      <div class="card-header bg-white fw-bold"><i class="bi bi-clipboard-check me-2 text-primary"></i>Dolazak i kotizacija</div>
      <div class="table-responsive">
        <table class="table table-hover mb-0 table-mobile-cards">
          <thead><tr><th>Igrač</th><th>Dolazak</th><th>Kotizacija</th><th></th></tr></thead>
          <tbody id="invitedTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add match modal -->
<div class="modal fade" id="addMatchModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Dodaj utakmicu</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Selekcija *</label>
            <select class="form-select" id="am_selection"></select>
          </div>
          <div class="col-12">
            <label class="form-label">Protivnik *</label>
            <input type="text" class="form-control" id="am_opponent" placeholder="npr. FK Club">
          </div>
          <div class="col-12">
            <label class="form-label">Lokacija</label>
            <input type="text" class="form-control" id="am_location">
          </div>
          <div class="col-12">
            <label class="form-label">Datum i vrijeme *</label>
            <input type="datetime-local" class="form-control" id="am_date">
          </div>
          <div class="col-6">
            <label class="form-label">Vrsta</label>
            <select class="form-select" id="am_type">
              <option value="cup" selected>Kup</option><option value="league">Liga</option><option value="friendly">Prijateljska</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Domaćin / Gost</label>
            <select class="form-select" id="am_homeaway">
              <option value="neutral" selected>Neutralno</option><option value="home">Domaćin</option><option value="away">Gost</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Odustani</button>
        <button class="btn btn-primary" onclick="submitAddMatch()">Dodaj</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/utils.js"></script>
<script>
const user = requireRole('super_admin', 'admin', 'coach', 'member');
setUserInfo(user); buildSidebar();
const isStaff = user.role !== 'member';

const params = new URLSearchParams(location.search);
const tournamentId = params.get('id');
if (!tournamentId) window.location.href = isStaff ? 'list.html' : 'my.html';

const RSVP_LABEL = { yes: 'Dolazi', maybe: 'Možda', no: 'Ne dolazi', pending: 'Čeka odgovor' };
const RSVP_CLASS = { yes: 'rsvp-yes', maybe: 'rsvp-maybe', no: 'rsvp-no', pending: 'rsvp-pending' };

function fmtDate(d) { return d ? new Date(d).toLocaleDateString('bs-BA') : '-'; }
function fmtDateTime(d) { return d ? new Date(d).toLocaleString('bs-BA', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '-'; }

let tournament = null;

function feeStatusInfo(fee, tournament) {
  if (!fee) return { label: '-', cls: 'bg-secondary-subtle text-secondary-emphasis' };
  if (fee.status === 'paid') return { label: 'Plaćeno', cls: 'bg-success-subtle text-success-emphasis' };
  const overdue = (tournament.date_start || '').slice(0, 10) < new Date().toISOString().slice(0, 10);
  return overdue
    ? { label: 'Zakašnjelo', cls: 'bg-danger-subtle text-danger-emphasis' }
    : { label: 'Na čekanju', cls: 'bg-warning-subtle text-warning-emphasis' };
}

function render() {
  document.getElementById('pageTitle').textContent = tournament.name;

  document.getElementById('infoCard').innerHTML = `
    <div class="row g-3">
      <div class="col-md-3"><div class="small text-muted">Selekcije</div><div class="fw-semibold">${tournament.selections.map(s => escHtml(s.name)).join(', ') || '-'}</div></div>
      <div class="col-md-3"><div class="small text-muted">Mjesto</div><div class="fw-semibold">${escHtml(tournament.location || '-')}</div></div>
      <div class="col-md-3"><div class="small text-muted">Period</div><div class="fw-semibold">${fmtDate(tournament.date_start)} - ${fmtDate(tournament.date_end)}</div></div>
      <div class="col-md-3"><div class="small text-muted">Kotizacija</div><div class="fw-semibold">${tournament.entry_fee_amount ? Number(tournament.entry_fee_amount).toFixed(2) + ' KM' : 'Nema'}</div></div>
    </div>`;

  document.getElementById('matchesList').innerHTML = tournament.matches.map(m => `
    <div class="list-group-item d-flex justify-content-between align-items-center">
      <a href="../matches/detail.html?id=${m.id}" class="text-decoration-none flex-grow-1">
        <span>vs ${escHtml(m.opponent)}</span>
        <span class="small text-muted ms-2">${escHtml(m.selection_name || '')} · ${fmtDateTime(m.match_date)}</span>
      </a>
      ${isStaff ? `<button class="btn btn-sm btn-outline-danger" onclick="removeMatch(${m.id})"><i class="bi bi-trash"></i></button>` : ''}
    </div>`).join('') || '<div class="list-group-item text-muted small">Nema utakmica</div>';

  if (!isStaff) return;

  const invitedIds = new Set(tournament.invited.map(i => i.member_id));
  document.getElementById('invitePicker').innerHTML = (window.__roster || [])
    .filter(m => !invitedIds.has(m.id))
    .map(m => `
      <div class="col-md-4 col-sm-6">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="${m.id}" id="inv_${m.id}">
          <label class="form-check-label" for="inv_${m.id}">${escHtml(m.name)}</label>
        </div>
      </div>`).join('') || '<div class="col-12 text-muted small">Svi članovi selekcija su već pozvani.</div>';

  document.getElementById('invitedTable').innerHTML = tournament.invited.map(i => {
    const rsvp = i.rsvp_status || 'pending';
    const fee = tournament.entry_fee_amount
      ? (() => {
          const info = feeStatusInfo(i.fee_id ? i : null, tournament);
          const btn = (i.fee_id && i.fee_status !== 'paid')
            ? `<button class="btn btn-sm btn-outline-success ms-2" onclick="markPaid(${i.fee_id})">Označi plaćeno</button>` : '';
          return `<span class="badge ${info.cls}">${info.label}</span>${btn}`;
        })()
      : '<span class="text-muted small">-</span>';
    return `
      <tr>
        <td data-label="Igrač">${escHtml(i.member_name)}${i.rsvp_note ? `<div class="small text-muted">${escHtml(i.rsvp_note)}</div>` : ''}</td>
        <td data-label="Dolazak"><span class="rsvp-badge ${RSVP_CLASS[rsvp]}">${RSVP_LABEL[rsvp]}</span></td>
        <td data-label="Kotizacija">${fee}</td>
        <td></td>
      </tr>`;
  }).join('') || '<tr><td colspan="4" class="text-center text-muted py-3">Niko još nije pozvan</td></tr>';
}

async function load() {
  try {
    tournament = await apiGet('/tournaments/' + tournamentId);

    if (isStaff) {
      document.getElementById('deleteBtn').classList.remove('d-none');
      document.getElementById('addMatchBtn').classList.remove('d-none');
      document.getElementById('inviteCard').classList.remove('d-none');
      document.getElementById('rsvpCard').classList.remove('d-none');

      const rosters = await Promise.all(tournament.selections.map(s => apiGet('/members?selection_id=' + s.id)));
      const merged = new Map();
      rosters.flat().forEach(m => merged.set(m.id, m));
      window.__roster = Array.from(merged.values());

      const selSelect = document.getElementById('am_selection');
      selSelect.innerHTML = tournament.selections.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('');
    }

    render();
  } catch (e) { showToast(e.message, 'error'); }
}

function openAddMatch() {
  document.getElementById('am_opponent').value = '';
  document.getElementById('am_location').value = tournament.location || '';
  document.getElementById('am_date').value = '';
  bootstrap.Modal.getOrCreateInstance(document.getElementById('addMatchModal')).show();
}

async function submitAddMatch() {
  const body = {
    selection_id: Number(document.getElementById('am_selection').value),
    opponent: document.getElementById('am_opponent').value.trim(),
    location: document.getElementById('am_location').value.trim(),
    match_date: document.getElementById('am_date').value,
    match_type: document.getElementById('am_type').value,
    home_away: document.getElementById('am_homeaway').value,
  };
  if (!body.opponent || !body.match_date) return showToast('Protivnik i datum/vrijeme su obavezni', 'error');
  try {
    await apiPost('/tournaments/' + tournamentId + '/matches', body);
    bootstrap.Modal.getInstance(document.getElementById('addMatchModal')).hide();
    showToast('Utakmica dodana', 'success');
    load();
  } catch (e) { showToast(e.message, 'error'); }
}

function removeMatch(matchId) {
  confirmDelete(async () => {
    try {
      await apiDelete('/tournaments/' + tournamentId + '/matches/' + matchId);
      showToast('Utakmica obrisana', 'success');
      load();
    } catch (e) { showToast(e.message, 'error'); }
  }, 'Obrisati ovu utakmicu?');
}

async function sendInvites() {
  const ids = Array.from(document.querySelectorAll('#invitePicker input:checked')).map(i => Number(i.value));
  if (!ids.length) return showToast('Izaberite bar jednog igrača', 'error');
  try {
    await apiPost('/tournaments/' + tournamentId + '/invite', { member_ids: ids });
    showToast('Pozivnice poslane', 'success');
    load();
  } catch (e) { showToast(e.message, 'error'); }
}

async function markPaid(feeId) {
  try {
    await apiPut('/tournaments/' + tournamentId + '/fees/' + feeId + '/pay', {});
    showToast('Kotizacija označena kao plaćena', 'success');
    load();
  } catch (e) { showToast(e.message, 'error'); }
}

function removeTournament() {
  confirmDelete(async () => {
    try {
      await apiDelete('/tournaments/' + tournamentId);
      showToast('Turnir obrisan', 'success');
      setTimeout(() => window.location.href = 'list.html', 800);
    } catch (e) { showToast(e.message, 'error'); }
  }, 'Obrisati turnir? Utakmice ostaju, samo gube vezu sa turnirom. Već plaćene kotizacije ostaju u Finansijama.');
}

load();
</script>
</body>
</html>
