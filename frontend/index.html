<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava - Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-card-wrap">

    <!-- Logo -->
    <div class="login-logo-wrap">
      <img src="assets/img/klavio-icon.png" alt="Klavio">
    </div>

    <!-- Card -->
    <div class="card border-0" style="border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,0.25);">
      <div class="card-body p-4 p-sm-5">
        <h5 class="fw-bold mb-1" style="letter-spacing:var(--ls-heading);color:var(--neutral-900);">Prijava u Klavio</h5>
        <p class="text-muted small mb-4">Unesite vaše podatke za pristup platformi.</p>

        <div id="alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">E-mail adresa</label>
            <input type="email" class="form-control" id="email"
              placeholder="ime@klub.com" required autofocus autocomplete="email">
          </div>
          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0" for="password">Lozinka</label>
              <a href="/forgot-password.html"
                class="text-decoration-none" style="font-size:var(--fs-xs);color:var(--club-accent);">
                Zaboravili ste lozinku?
              </a>
            </div>
            <input type="password" class="form-control" id="password"
              placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold" id="loginBtn"
            style="padding:0.6rem 1rem;">
            <span id="spinner" class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
            Prijavi se
          </button>
        </form>

        <p class="text-center mt-4 mb-0" style="font-size:var(--fs-xs);color:var(--neutral-500);">
          Nemate nalog?
          <a href="/website/register.html" style="color:var(--club-accent);font-weight:var(--fw-semibold);text-decoration:none;">
            Registrujte klub
          </a>
        </p>
      </div>
    </div>

    <!-- Back to marketing site -->
    <p class="text-center mt-4 mb-0" style="font-size:var(--fs-xs);color:rgba(255,255,255,0.45);">
      <a href="/website/" style="color:rgba(255,255,255,0.45);text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Nazad na klavio.ba
      </a>
    </p>

  </div>

  <script src="assets/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    const existingUser = getUser();
    if (existingUser) redirectToDashboard(existingUser.role);

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn     = document.getElementById('loginBtn');
      const spinner = document.getElementById('spinner');
      const alertEl = document.getElementById('alert');
      btn.disabled = true;
      spinner.classList.remove('d-none');
      alertEl.classList.add('d-none');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Prijava neuspješna');
        saveAuth(data.token, data.user, data.club, data.selection);
        redirectToDashboard(data.user.role);
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.classList.remove('d-none');
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
