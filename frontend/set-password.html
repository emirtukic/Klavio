<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postavite lozinku - Klavio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-card-wrap">

    <div class="login-logo-wrap">
      <img src="assets/img/klavio-icon.svg" alt="Klavio">
    </div>

    <!-- Loading state -->
    <div id="loadingCard" class="card border-0" style="border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,0.25);">
      <div class="card-body p-4 p-sm-5 text-center">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p class="text-muted mb-0">Provjera linka...</p>
      </div>
    </div>

    <!-- Error state -->
    <div id="errorCard" class="card border-0 d-none" style="border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,0.25);">
      <div class="card-body p-4 p-sm-5 text-center">
        <div class="mb-3" style="font-size:2.5rem;">❌</div>
        <h5 class="fw-bold mb-2" style="color:var(--neutral-900);">Link nije validan</h5>
        <p class="text-muted small mb-4" id="errorMsg">Link za postavljanje lozinke nije validan ili je istekao.</p>
        <a href="/" class="btn btn-primary w-100 fw-semibold">Idi na prijavu</a>
      </div>
    </div>

    <!-- Set password form -->
    <div id="formCard" class="card border-0 d-none" style="border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,0.25);">
      <div class="card-body p-4 p-sm-5">
        <h5 class="fw-bold mb-1" style="letter-spacing:var(--ls-heading);color:var(--neutral-900);">Postavite lozinku</h5>
        <p class="text-muted small mb-4" id="welcomeMsg">Dobrodošli! Postavite lozinku da aktivirate nalog.</p>

        <div id="alert" class="alert d-none py-2 small" role="alert"></div>

        <form id="setPasswordForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="password">Nova lozinka</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password"
                placeholder="Najmanje 8 karaktera" required autocomplete="new-password">
              <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1">
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="passwordConfirm">Potvrdite lozinku</label>
            <input type="password" class="form-control" id="passwordConfirm"
              placeholder="Unesite lozinku ponovo" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold" id="submitBtn"
            style="padding:0.6rem 1rem;">
            <span id="spinner" class="spinner-border spinner-border-sm d-none me-2" aria-hidden="true"></span>
            <i class="bi bi-check-lg me-1"></i>Aktiviraj nalog
          </button>
        </form>
      </div>
    </div>

    <!-- Success state -->
    <div id="successCard" class="card border-0 d-none" style="border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,0.25);">
      <div class="card-body p-4 p-sm-5 text-center">
        <div class="mb-3" style="font-size:2.5rem;">✅</div>
        <h5 class="fw-bold mb-2" style="color:var(--neutral-900);">Nalog aktiviran!</h5>
        <p class="text-muted small mb-4">Lozinka je uspješno postavljena. Možete se prijaviti.</p>
        <a href="/" class="btn btn-primary w-100 fw-semibold">Prijavite se</a>
      </div>
    </div>

    <p class="text-center mt-4 mb-0" style="font-size:var(--fs-xs);color:rgba(255,255,255,0.45);">
      <a href="/website/" style="color:rgba(255,255,255,0.45);text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Nazad na klavio.ba
      </a>
    </p>

  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    function show(id) {
      ['loadingCard','errorCard','formCard','successCard'].forEach(c => {
        document.getElementById(c).classList.toggle('d-none', c !== id);
      });
    }

    function showAlert(msg, type = 'danger') {
      const el = document.getElementById('alert');
      el.className = `alert alert-${type} py-2 small`;
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    async function validateToken() {
      if (!token) { show('errorCard'); return; }
      try {
        const res = await fetch(`/api/auth/set-password?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('errorMsg').textContent = data.message || 'Link nije validan ili je istekao.';
          show('errorCard');
          return;
        }
        document.getElementById('welcomeMsg').textContent =
          `Dobrodošli, ${data.name}! (${data.email}) - Postavite lozinku da aktivirate nalog.`;
        show('formCard');
        document.getElementById('password').focus();
      } catch {
        document.getElementById('errorMsg').textContent = 'Greška pri provjeri linka. Pokušajte ponovo.';
        show('errorCard');
      }
    }

    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    document.getElementById('setPasswordForm').addEventListener('submit', async e => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('passwordConfirm').value;

      if (password.length < 8) { showAlert('Lozinka mora imati najmanje 8 karaktera.'); return; }
      if (password !== confirm) { showAlert('Lozinke se ne podudaraju.'); return; }

      const btn     = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      btn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const res = await fetch('/api/auth/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) { showAlert(data.message || 'Greška. Pokušajte ponovo.'); return; }
        show('successCard');
      } catch {
        showAlert('Greška pri slanju zahtjeva. Pokušajte ponovo.');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });

    validateToken();
  </script>
</body>
</html>
