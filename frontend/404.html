<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="robots" content="noindex">
  <title>Stranica nije pronađena | Klavio</title>
  <link rel="stylesheet" href="/website.css">
  <style>
    body { background:var(--white); }
    .nf-wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
    .nf-wrap img { height:40px; margin-bottom:36px; }
    .nf-code { font-size:5rem; font-weight:900; color:var(--blue); line-height:1; letter-spacing:-0.03em; }
    .nf-title { font-size:1.4rem; font-weight:800; color:var(--dark2); margin-top:12px; }
    .nf-sub { font-size:1rem; color:var(--muted); margin-top:10px; max-width:420px; }
    .nf-actions { display:flex; gap:12px; margin-top:32px; flex-wrap:wrap; justify-content:center; }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <a href="/"><img src="/assets/img/klavio-icon.png" alt="Klavio"></a>
    <div class="nf-code">404</div>
    <div class="nf-title">Ova stranica ne postoji</div>
    <p class="nf-sub">Stranica koju tražite je uklonjena, premještena ili nikad nije postojala.</p>
    <div class="nf-actions">
      <a href="/" class="btn btn-primary btn-lg">Nazad na početnu</a>
      <a href="/contact.html" class="btn btn-outline btn-lg">Kontaktiraj nas</a>
    </div>
  </div>
</body>
</html>
